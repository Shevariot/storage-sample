<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gudang Sample - R&D Management</title>
    
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📦</text></svg>">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <style>
        :root {
            --bg-primary: #18181b;
            --bg-secondary: #27272a;
            --bg-tertiary: #3f3f46;
            --border: #52525b;
            --text-primary: #fafafa;
            --text-secondary: #a1a1aa;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
        }
        
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }
        
        body {
            background: var(--bg-primary);
            color: var(--text-primary);
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }
        
        /* Scrollbar */
        ::-webkit-scrollbar { width: 10px; }
        ::-webkit-scrollbar-track { background: var(--bg-primary); }
        ::-webkit-scrollbar-thumb { 
            background: var(--bg-tertiary);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover { background: var(--border); }
        
        /* Search Section */
        .search-section {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px;
        }
        
        .search-input {
            background: var(--bg-primary);
            border: 2px solid var(--border);
            color: var(--text-primary);
            padding: 14px 20px 14px 52px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 500;
            transition: all 0.2s;
            width: 100%;
        }
        
        .search-input:focus {
            outline: none;
            border-color: var(--accent);
            background: var(--bg-secondary);
        }
        
        .search-input::placeholder {
            color: var(--text-secondary);
        }
        
        /* Stats Cards */
        .stat-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            transition: all 0.2s;
        }
        
        .stat-card:hover {
            border-color: var(--bg-tertiary);
        }
        
        /* Item Cards */
        .item-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 16px 20px;
            transition: all 0.2s;
            cursor: pointer;
        }
        
        .item-card:hover {
            background: var(--bg-tertiary);
            border-color: var(--accent);
            transform: translateX(2px);
        }
        
        /* Location Badge */
        .location-badge {
            background: var(--bg-tertiary);
            color: var(--text-primary);
            font-weight: 700;
            font-size: 15px;
            padding: 6px 14px;
            border-radius: 6px;
            letter-spacing: 0.5px;
            border: 1px solid var(--border);
        }
        
        /* Status Badges */
        .badge-available {
            background: rgba(16, 185, 129, 0.15);
            color: var(--success);
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.3px;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }
        
        .badge-borrowed {
            background: rgba(245, 158, 11, 0.15);
            color: var(--warning);
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.3px;
            border: 1px solid rgba(245, 158, 11, 0.3);
        }
        
        /* Filter Pills */
        .filter-pill {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-secondary);
            padding: 8px 18px;
            border-radius: 8px;
            font-weight: 500;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .filter-pill:hover {
            background: var(--bg-tertiary);
            color: var(--text-primary);
        }
        
        .filter-pill.active {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }
        
        /* Buttons */
        .btn {
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
        }
        
        .btn-primary {
            background: var(--accent);
            color: white;
        }
        
        .btn-primary:hover {
            background: var(--accent-hover);
        }
        
        .btn-secondary {
            background: var(--bg-tertiary);
            color: var(--text-primary);
            border: 1px solid var(--border);
        }
        
        .btn-secondary:hover {
            background: var(--bg-secondary);
        }
        
        .btn-danger {
            background: var(--danger);
            color: white;
        }
        
        .btn-danger:hover {
            background: #dc2626;
        }
        
        /* Input Fields */
        input, select {
            background: var(--bg-primary);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.2s;
        }
        
        input:focus, select:focus {
            outline: none;
            border-color: var(--accent);
            background: var(--bg-secondary);
        }
        
        input::placeholder {
            color: var(--text-secondary);
        }
        
        /* Modal */
        .modal-overlay {
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(4px);
        }
        
        .modal-content {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 16px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
        }
        
        /* Loading */
        .loading-spinner {
            border: 3px solid var(--bg-tertiary);
            border-top: 3px solid var(--accent);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 0.8s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .animate-fadeIn { animation: fadeIn 0.3s ease-out; }
        .animate-slideUp { animation: slideUp 0.4s ease-out; }
        
        /* Responsive */
        @media (max-width: 1400px) {
            html { font-size: 14px; }
        }
    </style>
</head>
<body>

    <!-- NAVBAR -->
    <nav class="sticky top-0 z-50" style="background: var(--bg-secondary); border-bottom: 1px solid var(--border); backdrop-filter: blur(10px);">
        <div class="max-w-7xl mx-auto px-6 py-4">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-4">
                    <div class="w-10 h-10 rounded-lg flex items-center justify-center" style="background: var(--accent);">
                        <i class="fas fa-boxes text-lg text-white"></i>
                    </div>
                    <div>
                        <h1 class="text-lg font-bold" style="color: var(--text-primary);">Gudang Sample</h1>
                        <p class="text-xs" style="color: var(--text-secondary);">R&D Inventory Management</p>
                    </div>
                </div>
                
                <div class="flex items-center gap-3">
                    <button onclick="openAddModal()" class="btn btn-primary flex items-center gap-2">
                        <i class="fas fa-plus"></i>
                        <span>Tambah Barang</span>
                    </button>
                    <button onclick="fetchData()" class="btn btn-secondary px-4">
                        <i class="fas fa-sync-alt" id="refreshIcon"></i>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-6 py-6">
        
        <!-- STATS -->
        <div class="grid grid-cols-3 gap-4 mb-6 animate-slideUp">
            <div class="stat-card">
                <div class="flex items-center justify-between mb-2">
                    <div class="text-sm font-medium" style="color: var(--text-secondary);">Total Items</div>
                    <i class="fas fa-database" style="color: var(--text-secondary);"></i>
                </div>
                <div class="text-3xl font-bold" id="statTotal">0</div>
            </div>
            
            <div class="stat-card">
                <div class="flex items-center justify-between mb-2">
                    <div class="text-sm font-medium" style="color: var(--text-secondary);">Tersedia</div>
                    <i class="fas fa-check-circle" style="color: var(--success);"></i>
                </div>
                <div class="text-3xl font-bold" style="color: var(--success);" id="statAvailable">0</div>
            </div>
            
            <div class="stat-card">
                <div class="flex items-center justify-between mb-2">
                    <div class="text-sm font-medium" style="color: var(--text-secondary);">Dipinjam</div>
                    <i class="fas fa-hand-holding" style="color: var(--warning);"></i>
                </div>
                <div class="text-3xl font-bold" style="color: var(--warning);" id="statBorrowed">0</div>
            </div>
        </div>

        <!-- SEARCH & FILTER -->
        <div class="search-section mb-6 animate-slideUp" style="animation-delay: 0.1s;">
            <div class="grid grid-cols-12 gap-4 items-end">
                <!-- Search -->
                <div class="col-span-6">
                    <label class="block text-sm font-medium mb-2" style="color: var(--text-secondary);">Cari Barang</label>
                    <div class="relative">
                        <i class="fas fa-search absolute left-4 top-1/2 transform -translate-y-1/2" style="color: var(--text-secondary);"></i>
                        <input type="text" id="searchInput" class="search-input" 
                            placeholder="Style, client, sample no, atau lokasi..." 
                            onkeyup="performSearch()">
                    </div>
                </div>
                
                <!-- Cabinet Filter -->
                <div class="col-span-3">
                    <label class="block text-sm font-medium mb-2" style="color: var(--text-secondary);">Lemari</label>
                    <select id="cabinetFilter" onchange="filterByCabinet()" class="w-full">
                        <option value="">Semua Lemari</option>
                    </select>
                </div>
                
                <!-- Status Filter -->
                <div class="col-span-3">
                    <label class="block text-sm font-medium mb-2" style="color: var(--text-secondary);">Status</label>
                    <div class="flex gap-2">
                        <button onclick="filterByStatus('all')" id="filter-all" class="filter-pill active flex-1">Semua</button>
                        <button onclick="filterByStatus('tersedia')" id="filter-tersedia" class="filter-pill flex-1">Tersedia</button>
                        <button onclick="filterByStatus('dipinjam')" id="filter-dipinjam" class="filter-pill flex-1">Dipinjam</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- RESULTS HEADER -->
        <div class="flex items-center justify-between mb-4">
            <h3 class="text-base font-semibold" style="color: var(--text-primary);">
                <span id="resultCount" style="color: var(--accent);">0</span> hasil ditemukan
            </h3>
        </div>

        <!-- LOADING -->
        <div id="loadingState" class="hidden text-center py-16">
            <div class="loading-spinner mx-auto mb-4"></div>
            <p class="text-sm" style="color: var(--text-secondary);">Memuat data...</p>
        </div>

        <!-- ITEMS LIST -->
        <div id="itemsContainer" class="space-y-2"></div>

        <!-- EMPTY STATE -->
        <div id="emptyState" class="hidden text-center py-16">
            <i class="fas fa-inbox text-5xl mb-4" style="color: var(--text-secondary);"></i>
            <h3 class="text-lg font-semibold mb-1" style="color: var(--text-primary);">Tidak ada data</h3>
            <p class="text-sm" style="color: var(--text-secondary);">Coba ubah filter atau kata kunci pencarian</p>
        </div>
    </main>

    <!-- MODAL: DETAIL -->
    <div id="modalDetail" class="hidden fixed inset-0 z-50 modal-overlay flex items-center justify-center p-6">
        <div class="modal-content w-full max-w-2xl max-h-[85vh] overflow-y-auto animate-slideUp">
            <div class="p-6" style="border-bottom: 1px solid var(--border);">
                <div class="flex items-start justify-between">
                    <div class="flex-1">
                        <h2 class="text-xl font-bold mb-2" id="detailStyle">-</h2>
                        <div class="flex items-center gap-3 mb-3">
                            <span class="location-badge" id="detailTempat">-</span>
                            <span class="text-sm" style="color: var(--text-secondary);" id="detailClient">-</span>
                        </div>
                    </div>
                    <button onclick="closeDetailModal()" class="text-2xl" style="color: var(--text-secondary);" 
                        onmouseover="this.style.color='var(--text-primary)'" 
                        onmouseout="this.style.color='var(--text-secondary)'">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
            </div>
            
            <div class="p-6 space-y-6">
                <!-- Status Update -->
                <div class="stat-card">
                    <label class="block text-sm font-semibold mb-3" style="color: var(--text-primary);">Update Status</label>
                    <div class="flex gap-3 mb-3">
                        <select id="statusSelect" onchange="toggleBorrowerInput()" class="flex-1">
                            <option value="Tersedia">Tersedia di Lemari</option>
                            <option value="Dipinjam">Sedang Dipinjam</option>
                        </select>
                        <button onclick="saveStatus()" id="btnSaveStatus" class="btn btn-primary">
                            <i class="fas fa-save mr-2"></i>Simpan
                        </button>
                    </div>
                    <div id="borrowerInputDiv" class="hidden">
                        <input type="text" id="borrowerName" placeholder="Nama peminjam..." class="w-full">
                    </div>
                </div>
                
                <!-- Details -->
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-medium mb-1" style="color: var(--text-secondary);">Sample No</label>
                        <p class="text-sm font-semibold" id="detailSample">-</p>
                    </div>
                    <div>
                        <label class="block text-xs font-medium mb-1" style="color: var(--text-secondary);">Size</label>
                        <p class="text-sm font-semibold" id="detailSize">-</p>
                    </div>
                    <div>
                        <label class="block text-xs font-medium mb-1" style="color: var(--text-secondary);">Quantity</label>
                        <p class="text-sm font-semibold" id="detailQty">-</p>
                    </div>
                    <div>
                        <label class="block text-xs font-medium mb-1" style="color: var(--text-secondary);">Tanggal Masuk</label>
                        <p class="text-sm font-semibold" id="detailDate">-</p>
                    </div>
                </div>
                
                <!-- History -->
                <div>
                    <h3 class="font-semibold mb-3 flex items-center gap-2" style="color: var(--text-primary);">
                        <i class="fas fa-history" style="color: var(--accent);"></i>
                        Riwayat
                    </h3>
                    <div id="logContainer" style="border-left: 2px solid var(--border); padding-left: 16px;">
                        <p class="text-sm" style="color: var(--text-secondary);">Memuat...</p>
                    </div>
                </div>
                
                <!-- Actions -->
                <div class="flex gap-3 pt-4" style="border-top: 1px solid var(--border);">
                    <button onclick="editItemMode()" class="btn btn-secondary flex-1">
                        <i class="fas fa-edit mr-2"></i>Edit
                    </button>
                    <button onclick="deleteItem()" class="btn btn-danger flex-1">
                        <i class="fas fa-trash mr-2"></i>Hapus
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL: FORM -->
    <div id="modalForm" class="hidden fixed inset-0 z-50 modal-overlay flex items-center justify-center p-6">
        <div class="modal-content w-full max-w-2xl max-h-[85vh] overflow-y-auto animate-slideUp">
            <div class="p-6" style="border-bottom: 1px solid var(--border);">
                <div class="flex items-center justify-between">
                    <h2 class="text-lg font-bold" id="formTitle">Tambah Barang Baru</h2>
                    <button onclick="closeFormModal()" class="text-2xl" style="color: var(--text-secondary);"
                        onmouseover="this.style.color='var(--text-primary)'" 
                        onmouseout="this.style.color='var(--text-secondary)'">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
            </div>
            
            <form onsubmit="submitItemForm(event)" id="itemForm" class="p-6">
                <input type="hidden" id="editRowIndex">
                
                <div class="grid grid-cols-2 gap-4 mb-6">
                    <div class="col-span-2">
                        <label class="block text-sm font-medium mb-2" style="color: var(--text-secondary);">
                            Style Name <span style="color: var(--danger);">*</span>
                        </label>
                        <input type="text" id="inStyle" required placeholder="DELTA TECH OPS VEST">
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium mb-2" style="color: var(--text-secondary);">Client</label>
                        <input type="text" id="inClient" placeholder="AN05">
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium mb-2" style="color: var(--text-secondary);">
                            Lokasi Lemari <span style="color: var(--danger);">*</span>
                        </label>
                        <input type="text" id="inTempat" required placeholder="C5B">
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium mb-2" style="color: var(--text-secondary);">Sample No</label>
                        <input type="text" id="inSample" placeholder="RK01">
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium mb-2" style="color: var(--text-secondary);">Size</label>
                        <input type="text" id="inSize" placeholder="M, L, XL">
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium mb-2" style="color: var(--text-secondary);">Qty</label>
                        <input type="number" id="inQty" min="1" placeholder="1">
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium mb-2" style="color: var(--text-secondary);">Unit</label>
                        <select id="inUnit">
                            <option value="PCS">PCS</option>
                            <option value="SET">SET</option>
                            <option value="PACK">PACK</option>
                        </select>
                    </div>
                    
                    <div class="col-span-2">
                        <label class="block text-sm font-medium mb-2" style="color: var(--text-secondary);">Tanggal Masuk</label>
                        <input type="date" id="inDate">
                    </div>
                </div>
                
                <div class="flex gap-3">
                    <button type="button" onclick="closeFormModal()" class="btn btn-secondary flex-1">Batal</button>
                    <button type="submit" id="btnFormSubmit" class="btn btn-primary flex-1">
                        <i class="fas fa-save mr-2"></i>Simpan Data
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // GANTI URL INI DENGAN GOOGLE APPS SCRIPT KAMU!
        const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbykDMMuhXxj1Y8Eag7xsgm5FtmFU1BQWQHM1NWF_T3uH_I5CeQq3C2_fJKVbVWkpq9y/exec';
        
        let allData = [];
        let logsData = [];
        let filteredData = [];
        let currentItem = null;
        let currentStatusFilter = 'all';
        let currentSearchQuery = '';
        let currentCabinetFilter = '';

        document.addEventListener('DOMContentLoaded', () => {
            fetchData();
            document.getElementById('inDate').valueAsDate = new Date();
        });

        async function fetchData() {
            const icon = document.getElementById('refreshIcon');
            icon.style.animation = 'spin 0.8s linear infinite';
            showLoading();
            
            try {
                const response = await fetch(GOOGLE_SCRIPT_URL);
                const data = await response.json();
                allData = data.data || [];
                logsData = data.logs || [];
                updateStats();
                populateCabinetFilter();
                applyFilters();
            } catch (error) {
                console.error('Error:', error);
                Swal.fire({
                    icon: 'error',
                    title: 'Error',
                    text: 'Gagal memuat data dari server',
                    background: '#27272a',
                    color: '#fafafa',
                    confirmButtonColor: '#3b82f6'
                });
            } finally {
                icon.style.animation = '';
                hideLoading();
            }
        }

        function updateStats() {
            const total = allData.length;
            const available = allData.filter(item => item.STATUS === 'Tersedia').length;
            const borrowed = allData.filter(item => item.STATUS === 'Dipinjam').length;
            
            animateValue('statTotal', 0, total, 600);
            animateValue('statAvailable', 0, available, 600);
            animateValue('statBorrowed', 0, borrowed, 600);
        }

        function animateValue(id, start, end, duration) {
            const element = document.getElementById(id);
            const range = end - start;
            if (range === 0) {
                element.textContent = end;
                return;
            }
            const increment = end > start ? 1 : -1;
            const stepTime = Math.abs(Math.floor(duration / range));
            let current = start;
            const timer = setInterval(() => {
                current += increment;
                element.textContent = current;
                if (current === end) clearInterval(timer);
            }, stepTime);
        }

        function populateCabinetFilter() {
            const cabinets = [...new Set(allData.map(item => item.TEMPAT || '').filter(Boolean))].sort();
            const select = document.getElementById('cabinetFilter');
            select.innerHTML = '<option value="">Semua Lemari</option>';
            cabinets.forEach(cabinet => {
                select.innerHTML += `<option value="${cabinet}">${cabinet}</option>`;
            });
        }

        function filterByStatus(status) {
            currentStatusFilter = status;
            ['all', 'tersedia', 'dipinjam'].forEach(s => {
                const btn = document.getElementById(`filter-${s}`);
                btn.className = s === status ? 'filter-pill active flex-1' : 'filter-pill flex-1';
            });
            applyFilters();
        }

        function filterByCabinet() {
            currentCabinetFilter = document.getElementById('cabinetFilter').value;
            applyFilters();
        }

        function performSearch() {
            currentSearchQuery = document.getElementById('searchInput').value.toLowerCase().trim();
            applyFilters();
        }

        function applyFilters() {
            filteredData = allData.filter(item => {
                if (currentStatusFilter !== 'all') {
                    const status = currentStatusFilter === 'tersedia' ? 'Tersedia' : 'Dipinjam';
                    if (item.STATUS !== status) return false;
                }
                
                if (currentCabinetFilter && item.TEMPAT !== currentCabinetFilter) return false;
                
                if (currentSearchQuery) {
                    const searchFields = [
                        item.STYLE || '',
                        item.CLIENT || '',
                        item['SAMPLE NO'] || '',
                        item.TEMPAT || '',
                        item.SIZE || ''
                    ].join(' ').toLowerCase();
                    
                    if (!searchFields.includes(currentSearchQuery)) return false;
                }
                
                return true;
            });
            
            renderItems();
        }

        function renderItems() {
            const container = document.getElementById('itemsContainer');
            const emptyState = document.getElementById('emptyState');
            const resultCount = document.getElementById('resultCount');
            
            if (filteredData.length === 0) {
                container.classList.add('hidden');
                emptyState.classList.remove('hidden');
                resultCount.textContent = '0';
                return;
            }
            
            container.classList.remove('hidden');
            emptyState.classList.add('hidden');
            resultCount.textContent = filteredData.length;
            
            container.innerHTML = filteredData.map((item, index) => {
                const isAvailable = item.STATUS === 'Tersedia';
                const badgeClass = isAvailable ? 'badge-available' : 'badge-borrowed';
                const badgeText = isAvailable ? 'Tersedia' : 'Dipinjam';
                
                return `
                    <div class="item-card animate-fadeIn" onclick="openDetailModal(${item.originalIndex})" style="animation-delay: ${index * 0.02}s">
                        <div class="flex items-center gap-4">
                            <div class="location-badge">${item.TEMPAT || 'N/A'}</div>
                            <div class="flex-1 min-w-0">
                                <div class="flex items-center gap-3 mb-1">
                                    <h3 class="text-base font-semibold truncate" style="color: var(--text-primary);">${item.STYLE || '-'}</h3>
                                    <span class="${badgeClass}">${badgeText}</span>
                                </div>
                                <div class="flex flex-wrap gap-3 text-sm" style="color: var(--text-secondary);">
                                    ${item.CLIENT ? `<span>${item.CLIENT}</span>` : ''}
                                    ${item['SAMPLE NO'] ? `<span>• ${item['SAMPLE NO']}</span>` : ''}
                                    ${item.SIZE ? `<span>• Size ${item.SIZE}</span>` : ''}
                                    ${item.QTY ? `<span>• ${item.QTY} ${item.UNIT || 'PCS'}</span>` : ''}
                                </div>
                                ${!isAvailable && item.PEMINJAM ? 
                                    `<div class="mt-2 text-sm" style="color: var(--warning);">
                                        <i class="fas fa-user mr-1"></i>Dipinjam oleh: ${item.PEMINJAM}
                                    </div>` : ''}
                            </div>
                            <i class="fas fa-chevron-right" style="color: var(--text-secondary);"></i>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function openDetailModal(index) {
            currentItem = allData.find(item => item.originalIndex === index);
            if (!currentItem) return;
            
            document.getElementById('detailStyle').textContent = currentItem.STYLE || '-';
            document.getElementById('detailTempat').textContent = currentItem.TEMPAT || '-';
            document.getElementById('detailClient').textContent = currentItem.CLIENT || 'Tidak ada client';
            document.getElementById('detailSample').textContent = currentItem['SAMPLE NO'] || '-';
            document.getElementById('detailSize').textContent = currentItem.SIZE || '-';
            document.getElementById('detailQty').textContent = `${currentItem.QTY || '-'} ${currentItem.UNIT || 'PCS'}`;
            document.getElementById('detailDate').textContent = formatDate(currentItem.DATE);
            
            document.getElementById('statusSelect').value = currentItem.STATUS || 'Tersedia';
            document.getElementById('borrowerName').value = currentItem.PEMINJAM || '';
            toggleBorrowerInput();
            
            renderHistoryLogs(currentItem.STYLE);
            
            document.getElementById('modalDetail').classList.remove('hidden');
        }

        function closeDetailModal() {
            document.getElementById('modalDetail').classList.add('hidden');
        }

        function toggleBorrowerInput() {
            const status = document.getElementById('statusSelect').value;
            const div = document.getElementById('borrowerInputDiv');
            div.classList.toggle('hidden', status !== 'Dipinjam');
        }

        async function saveStatus() {
            const status = document.getElementById('statusSelect').value;
            const borrower = document.getElementById('borrowerName').value.trim();
            
            if (status === 'Dipinjam' && !borrower) {
                Swal.fire({
                    icon: 'warning',
                    title: 'Perhatian',
                    text: 'Nama peminjam wajib diisi!',
                    background: '#27272a',
                    color: '#fafafa',
                    confirmButtonColor: '#3b82f6'
                });
                return;
            }
            
            const btn = document.getElementById('btnSaveStatus');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-spinner" style="animation: spin 0.8s linear infinite"></i> Menyimpan...';
            btn.disabled = true;
            
            try {
                await fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify({
                        action: 'updateStatus',
                        rowIndex: currentItem.originalIndex,
                        status: status,
                        borrower: borrower,
                        styleName: currentItem.STYLE
                    })
                });
                
                closeDetailModal();
                Swal.fire({
                    icon: 'success',
                    title: 'Berhasil',
                    text: 'Status telah diupdate',
                    timer: 1500,
                    showConfirmButton: false,
                    background: '#27272a',
                    color: '#fafafa'
                });
                fetchData();
            } catch (error) {
                Swal.fire({
                    icon: 'error',
                    title: 'Error',
                    text: 'Gagal mengupdate status',
                    background: '#27272a',
                    color: '#fafafa',
                    confirmButtonColor: '#3b82f6'
                });
            } finally {
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        }

        function renderHistoryLogs(styleName) {
            const container = document.getElementById('logContainer');
            const itemLogs = logsData.filter(l => l.STYLE === styleName).reverse();
            
            if (itemLogs.length === 0) {
                container.innerHTML = '<p class="text-sm" style="color: var(--text-secondary);">Belum ada riwayat</p>';
                return;
            }
            
            container.innerHTML = itemLogs.map(log => {
                const date = new Date(log.WAKTU).toLocaleString('id-ID', {
                    day: '2-digit',
                    month: 'short',
                    year: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                });
                const isPinjam = log.AKSI === 'Dipinjam';
                const dotColor = isPinjam ? 'var(--warning)' : 'var(--success)';
                
                return `
                    <div class="relative pb-4">
                        <div style="position: absolute; left: -20px; top: 4px; width: 8px; height: 8px; border-radius: 50%; background: ${dotColor};"></div>
                        <p class="text-xs mb-1" style="color: var(--text-secondary);">${date}</p>
                        <p class="text-sm font-medium">${log.AKSI}${log.PEMINJAM ? ' oleh ' + log.PEMINJAM : ''}</p>
                        ${log.KETERANGAN ? `<p class="text-xs mt-1" style="color: var(--text-secondary);">${log.KETERANGAN}</p>` : ''}
                    </div>
                `;
            }).join('');
        }

        async function deleteItem() {
            const result = await Swal.fire({
                title: 'Hapus Barang?',
                text: "Data yang dihapus tidak dapat dikembalikan!",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#ef4444',
                cancelButtonColor: '#52525b',
                confirmButtonText: 'Ya, Hapus',
                cancelButtonText: 'Batal',
                background: '#27272a',
                color: '#fafafa'
            });
            
            if (!result.isConfirmed) return;
            
            Swal.showLoading();
            
            try {
                await fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify({
                        action: 'deleteItem',
                        rowIndex: currentItem.originalIndex,
                        styleName: currentItem.STYLE
                    })
                });
                
                closeDetailModal();
                Swal.fire({
                    icon: 'success',
                    title: 'Terhapus',
                    text: 'Barang telah dihapus',
                    background: '#27272a',
                    color: '#fafafa',
                    confirmButtonColor: '#3b82f6'
                });
                fetchData();
            } catch (error) {
                Swal.fire({
                    icon: 'error',
                    title: 'Error',
                    text: 'Gagal menghapus barang',
                    background: '#27272a',
                    color: '#fafafa',
                    confirmButtonColor: '#3b82f6'
                });
            }
        }

        function openAddModal() {
            document.getElementById('formTitle').textContent = 'Tambah Barang Baru';
            document.getElementById('itemForm').reset();
            document.getElementById('editRowIndex').value = '';
            document.getElementById('inDate').valueAsDate = new Date();
            document.getElementById('modalForm').classList.remove('hidden');
        }

        function editItemMode() {
            closeDetailModal();
            
            document.getElementById('formTitle').textContent = 'Edit Detail Barang';
            document.getElementById('editRowIndex').value = currentItem.originalIndex;
            document.getElementById('inStyle').value = currentItem.STYLE || '';
            document.getElementById('inClient').value = currentItem.CLIENT || '';
            document.getElementById('inTempat').value = currentItem.TEMPAT || '';
            document.getElementById('inSample').value = currentItem['SAMPLE NO'] || '';
            document.getElementById('inSize').value = currentItem.SIZE || '';
            document.getElementById('inQty').value = currentItem.QTY || '';
            document.getElementById('inUnit').value = currentItem.UNIT || 'PCS';
            
            if (currentItem.DATE) {
                const date = new Date(currentItem.DATE);
                document.getElementById('inDate').valueAsDate = date;
            }
            
            document.getElementById('modalForm').classList.remove('hidden');
        }

        function closeFormModal() {
            document.getElementById('modalForm').classList.add('hidden');
        }

        async function submitItemForm(e) {
            e.preventDefault();
            
            const editIndex = document.getElementById('editRowIndex').value;
            const isEdit = editIndex !== '';
            const action = isEdit ? 'editItem' : 'addItem';
            
            const btn = document.getElementById('btnFormSubmit');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-spinner" style="animation: spin 0.8s linear infinite"></i> Menyimpan...';
            btn.disabled = true;
            
            const payload = {
                action: action,
                rowIndex: editIndex,
                style: document.getElementById('inStyle').value,
                client: document.getElementById('inClient').value,
                tempat: document.getElementById('inTempat').value,
                sampleNo: document.getElementById('inSample').value,
                date: document.getElementById('inDate').value,
                size: document.getElementById('inSize').value,
                qty: document.getElementById('inQty').value,
                unit: document.getElementById('inUnit').value
            };
            
            try {
                await fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });
                
                closeFormModal();
                Swal.fire({
                    icon: 'success',
                    title: 'Berhasil',
                    text: isEdit ? 'Data berhasil diperbarui' : 'Barang berhasil ditambahkan',
                    timer: 1500,
                    showConfirmButton: false,
                    background: '#27272a',
                    color: '#fafafa'
                });
                fetchData();
            } catch (error) {
                console.error(error);
                Swal.fire({
                    icon: 'error',
                    title: 'Error',
                    text: 'Gagal menyimpan data',
                    background: '#27272a',
                    color: '#fafafa',
                    confirmButtonColor: '#3b82f6'
                });
            } finally {
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        }

        function formatDate(dateString) {
            if (!dateString || dateString === '-') return '-';
            const date = new Date(dateString);
            return date.toLocaleDateString('id-ID', {
                day: '2-digit',
                month: 'short',
                year: 'numeric'
            });
        }

        function showLoading() {
            document.getElementById('loadingState').classList.remove('hidden');
            document.getElementById('itemsContainer').classList.add('hidden');
            document.getElementById('emptyState').classList.add('hidden');
        }

        function hideLoading() {
            document.getElementById('loadingState').classList.add('hidden');
        }
    </script>
</body>
</html>
